[project]
name = "mmm-nl2sql"
version = "1.0.1"
description = "MMM NL2SQL MCP server for read-only PostgreSQL analytics"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.4.1",
    "psycopg2-binary>=2.9.9",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "httpx>=0.27.0"]
